<!DOCTYPE html>

<html>
<head>
    <title>Modpack Admin</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
        }

```

</head>
<body>

<h1>Admin Panel</h1>

<form id="uploadForm">
    <input type="file" name="modpack" required>
    <button type="submit">Upload</button>
</form>

<p id="status"></p>

<h2>Files</h2>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Size</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="fileList">
        <tr><td colspan="3">Loading...</td></tr>
    </tbody>
</table>

<script>
const token = new URLSearchParams(window.location.search).get("token");

function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

async function loadFiles() {
    const response = await fetch("/api/modpacks");
    const files = await response.json();

    const tbody = document.getElementById("fileList");

    if (!files.length) {
        tbody.innerHTML =
            "<tr><td colspan='3'>No files found.</td></tr>";
        return;
    }

    tbody.innerHTML = files.map(file => `
        <tr>
            <td>${file.name}</td>
            <td>${formatSize(file.size)}</td>
            <td>
                <button onclick="deleteFile('${encodeURIComponent(file.name)}')">
                    Delete
                </button>
            </td>
        </tr>
    `).join("");
}

async function deleteFile(filename) {
    if (!confirm("Delete this file?")) {
        return;
    }

    const response = await fetch(
        `/delete/${filename}?token=${encodeURIComponent(token)}`,
        {
            method: "DELETE"
        }
    );

    alert(await response.text());
    loadFiles();
}

document
    .getElementById("uploadForm")
    .addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);

        const response = await fetch(
            `/upload?token=${encodeURIComponent(token)}`,
            {
                method: "POST",
                body: formData
            }
        );

        document.getElementById("status").textContent =
            await response.text();

        e.target.reset();
        loadFiles();
    });

loadFiles();
</script>

</body>
</html>
