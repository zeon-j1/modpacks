<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modpack Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        <span id="themeLabel">Light</span>
    </button>

    <div class="container">
        <header>
            <p class="eyebrow danger">Restricted — Admin Access</p>
            <h1>ADMIN <span class="danger">PANEL</span></h1>
        </header>

        <div class="card">
            <p class="card-title">Upload Modpack</p>
            <div class="upload-row">
                <label class="file-label" id="fileLabel" for="fileInput">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span id="fileLabelText">Choose file…</span>
                </label>
                <input type="file" id="fileInput" name="modpack" required>
                <button class="btn btn-primary" id="uploadBtn" disabled>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/><path d="M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/></svg>
                    Upload
                </button>
            </div>
            <p id="status"></p>
        </div>

        <p class="section-title">Uploaded Files</p>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Size</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="fileList">
                    <tr><td colspan="3" class="empty">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ── Theme toggle ──────────────────────────────────────────
        const html = document.documentElement;
        const themeLabel = document.getElementById("themeLabel");

        const savedTheme = localStorage.getItem("theme") || "dark";
        html.setAttribute("data-theme", savedTheme);
        themeLabel.textContent = savedTheme === "dark" ? "Light" : "Dark";

        document.getElementById("themeToggle").addEventListener("click", () => {
            const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
            html.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
            themeLabel.textContent = next === "dark" ? "Light" : "Dark";
        });

        // ── Admin logic ───────────────────────────────────────────
        const token = new URLSearchParams(window.location.search).get("token");

        const fileInput = document.getElementById("fileInput");
        const fileLabel = document.getElementById("fileLabel");
        const fileLabelText = document.getElementById("fileLabelText");
        const uploadBtn = document.getElementById("uploadBtn");

        fileInput.addEventListener("change", () => {
            if (fileInput.files.length) {
                fileLabelText.textContent = fileInput.files[0].name;
                fileLabel.classList.add("has-file");
                uploadBtn.disabled = false;
            } else {
                fileLabelText.textContent = "Choose file…";
                fileLabel.classList.remove("has-file");
                uploadBtn.disabled = true;
            }
        });

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        function setStatus(msg, type) {
            const el = document.getElementById("status");
            el.textContent = msg;
            el.className = type || "";
        }

        async function loadFiles() {
            const response = await fetch("/api/modpacks");
            const files = await response.json();
            const tbody = document.getElementById("fileList");

            if (!files.length) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty">No files uploaded yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = files.map((file, i) => `
                <tr style="animation-delay:${i * 0.05}s">
                    <td>${file.name}</td>
                    <td>${formatSize(file.size)}</td>
                    <td>
                        <button class="btn btn-danger" onclick="deleteFile('${encodeURIComponent(file.name)}')">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                            Delete
                        </button>
                    </td>
                </tr>
            `).join("");
        }

        async function deleteFile(filename) {
            if (!confirm("Delete this file?")) return;

            const response = await fetch(
                `/delete/${filename}?token=${encodeURIComponent(token)}`,
                { method: "DELETE" }
            );

            setStatus(await response.text(), response.ok ? "ok" : "err");
            loadFiles();
        }

        uploadBtn.addEventListener("click", async () => {
            if (!fileInput.files.length) return;

            uploadBtn.disabled = true;
            setStatus("Uploading…");

            const formData = new FormData();
            formData.append("modpack", fileInput.files[0]);

            try {
                const response = await fetch(
                    `/upload?token=${encodeURIComponent(token)}`,
                    { method: "POST", body: formData }
                );

                setStatus(await response.text(), response.ok ? "ok" : "err");

                fileInput.value = "";
                fileLabelText.textContent = "Choose file…";
                fileLabel.classList.remove("has-file");
                loadFiles();
            } catch {
                setStatus("Upload failed.", "err");
            } finally {
                uploadBtn.disabled = false;
            }
        });

        loadFiles();
    </script>
</body>
</html>
